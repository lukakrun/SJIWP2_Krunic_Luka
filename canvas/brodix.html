<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jedrilica</title>

    <style>
        body {
            margin: 0;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .slika {
            width: 450px;
            height: 440px;
            border: 5px solid black;
            position: relative;
            overflow: hidden;
            background-color: #add8e6;
        }

        /* Sunce */
        .sunce {
            position: absolute;
            width: 98px;
            height: 98px;
            background-color: yellow;
            border-radius: 50%;
            right: 25px;
            top: 30px;
        }

       
        .more {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 110px;
            background: linear-gradient(to right, blue, #5b8bd8);
            border-top: 2px solid #777;
        }

       
        .trup {
            position: absolute;
            width: 185px;
            height: 45px;
            background-color: #b52b2b;
            left: 75px;
            bottom: 86px;
        }

       
        .jarbol {
            position: absolute;
            width: 10px;
            height: 195px;
            background-color: black;
            left: 162px;
            bottom: 131px;
        }

        
        .jedro {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 72px solid transparent;
            border-right: 72px solid transparent;
            border-bottom: 120px solid white;
            left: 94px;
            bottom: 140px;
        }

        
        .malo-jedro {
            position: absolute;
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 40px solid green;
            left: 119px;
            bottom: 280px;
        }
    </style>
</head>

<body>

    <div class="slika">

        <div class="sunce"></div>

        <div class="more"></div>

        <div class="jedro"></div>

        <div class="malo-jedro"></div>

        <div class="jarbol"></div>

        <div class="trup"></div>
        

    </div>
    <!-- DRUGA SLIKA - ŠUMA -->

<div style="
    width:450px;
    height:320px;
    position:relative;
    overflow:hidden;
    background:#f1dac0;
    border-radius:4px;
    margin:30px auto;
">

        position:absolute;

    "></div>

    <!-- veliko lijevo drvo -->
    <div style="
        position:absolute;
        left:32px;
        bottom:80px;
        width:0;
        height:0;
        border-left:32px solid transparent;
        border-right:32px solid transparent;
        border-bottom:160px solid #34765f;
    "></div>

    <div style="
        position:absolute;
        left:61px;
        bottom:48px;
        width:7px;
        height:35px;
        background:#778074;
    "></div>


    <!-- drugo drvo -->
    <div style="
        position:absolute;
        left:102px;

        width:0;
        height:0;
        border-left:20px solid transparent;
        border-right:20px solid transparent;
        border-bottom:97px solid #34765f;
    "></div>

    <div style="
        position:absolute;
        left:120px;
        bottom:61px;
        width:5px;
        height:25px;
        background:#778074;
    "></div>


    <!-- treće drvo -->
    <div style="
        position:absolute;
        left:205px;
        bottom:96px;
        width:0;
        height:0;
        border-left:16px solid transparent;
        border-right:16px solid transparent;
        border-bottom:80px solid #34765f;
    "></div>

    <div style="
        position:absolute;
        left:219px;
        bottom:76px;
        width:5px;
        height:20px;
        background:#778074;
    "></div>


    <!-- veliko desno drvo -->
    <div style="
        position:absolute;
        right:18px;
        bottom:80px;
        width:0;
        height:0;
        border-left:32px solid transparent;
        border-right:32px solid transparent;
        border-bottom:160px solid #34765f;
    "></div>

    <div style="
        position:absolute;
        right:48px;
        bottom:48px;
        width:7px;
        height:35px;
        background:#778074;
    "></div>

</div>


</body>
</html>
