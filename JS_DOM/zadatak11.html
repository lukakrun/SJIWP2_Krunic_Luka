
<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 11 - Promijeni poveznicu</title>
</head>
<body>

    <h2>Promjena poveznice</h2>

    <a id="poveznica" href="https://www.google.com" target="_blank">
        Otvori Google
    </a>

    <br><br>

    <button onclick="promijeniPoveznicu()">
        Promijeni poveznicu
    </button>

    <script>
        function promijeniPoveznicu() {
            const poveznica = document.getElementById("poveznica");

            poveznica.href = "https://www.wikipedia.org";
            poveznica.textContent = "Otvori Wikipediju";
        }
    </script>

</body>
</html>
